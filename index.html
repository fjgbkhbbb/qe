<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERM://ACCESS — 登入 / 註冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05080a;
    --panel: #0a1210;
    --panel-raised: #0e1a16;
    --green: #3ddc78;
    --green-dim: #1c4d2c;
    --green-soft: #9dffc0;
    --amber: #ffb238;
    --amber-dim: #6b4c14;
    --danger: #ff5c5c;
    --muted: #5f7a6c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(120% 90% at 20% 0%, rgba(61,220,120,0.06), transparent 55%),
      var(--bg);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    display:flex; align-items:center; justify-content:center;
    padding: 28px 14px;
  }

  .crt-card{
    position: relative;
    width: min(920px, 100%);
    min-height: 580px;
    display: grid;
    grid-template-columns: 0.86fr 1fr;
    background: var(--panel);
    border: 1px solid var(--green-dim);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 40px 90px -32px rgba(0,0,0,0.75), 0 0 40px rgba(61,220,120,0.06);
  }
  .crt-card::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.22) 2px, rgba(0,0,0,0.22) 3px);
    mix-blend-mode: multiply;
    pointer-events:none;
  }

  /* ---------------- LEFT: monitor / game panel ---------------- */
  .monitor-panel{
    padding: 26px 26px 22px;
    background: linear-gradient(180deg, #0a1512 0%, #060b09 100%);
    border-right: 1px solid var(--green-dim);
    display:flex; flex-direction:column;
  }

  .monitor-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size: 10.5px; letter-spacing: 1px; margin-bottom: 12px;
  }
  .monitor-top .tag{ color: var(--green); text-shadow: 0 0 6px var(--green); }
  .monitor-top .stat{ color: var(--amber); text-shadow: 0 0 6px var(--amber); }

  .stage{ position: relative; align-self:center; }
  canvas#board{
    display:block;
    width: 260px; height: 260px;
    background: #030603;
    border: 1px solid var(--green-dim);
    box-shadow: 0 0 24px rgba(61,220,120,0.08) inset;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(3,6,3,0.9);
    text-align:center; gap:8px; padding: 14px;
  }
  .overlay h3{ margin:0; font-size:13px; letter-spacing:1.5px; color:var(--green); text-shadow:0 0 8px var(--green); }
  .overlay p{ margin:0; font-size:10.5px; color:var(--amber); line-height:1.6; }
  .overlay .hint{ color: var(--muted); font-size: 9.5px; margin-top:4px; }
  .overlay .lock-icon{
    font-size: 22px;
    filter: drop-shadow(0 0 6px rgba(61,220,120,0.4));
    margin-bottom: 2px;
  }
  .term-btn{
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: inherit;
    font-size: 10.5px;
    padding: 7px 16px;
    letter-spacing: 1.5px;
    cursor: pointer;
    text-shadow: 0 0 6px var(--green);
  }
  .term-btn:hover{ background: rgba(61,220,120,0.1); }
  .term-btn:focus-visible{ outline: 2px solid var(--amber); outline-offset:2px; }
  .hidden{ display:none; }

  .monitor-bottom{
    margin-top: 16px;
    font-size: 9.5px;
    color: var(--muted);
    display:flex; justify-content:space-between;
    border-top: 1px solid rgba(61,220,120,0.12);
    padding-top: 10px;
    letter-spacing: 0.5px;
  }
  .monitor-bottom b{ color: var(--green-soft); font-weight:500; }

  .monitor-blurb{
    margin-top: auto;
    padding-top: 18px;
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.7;
  }
  .monitor-blurb b{ color: var(--amber); }

  #mpScoreboard{
    display:flex; justify-content:space-between;
    font-size: 10.5px; margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(61,220,120,0.10);
  }
  #mpScoreboard.hidden{ display:none; }
  #mpScoreboard .you{ color: var(--green-soft); text-shadow:0 0 4px rgba(61,220,120,0.5); }
  #mpScoreboard .them{ color: var(--amber); text-shadow:0 0 4px rgba(255,178,56,0.4); }

  .overlay .menu-row{ display:flex; gap:10px; margin-top:4px; }
  .overlay .mp-tabs{ display:flex; gap:16px; margin-bottom:4px; }
  .overlay .mp-tab{
    background:none; border:none; cursor:pointer; font-family:inherit;
    font-size: 10.5px; color: var(--muted); padding: 2px 0;
  }
  .overlay .mp-tab.active{ color: var(--green); text-shadow:0 0 4px var(--green); }
  .overlay .mp-tab:focus-visible{ outline: 2px solid var(--amber); outline-offset:2px; }
  .overlay textarea{
    width: 100%; height: 52px; resize: none;
    background: rgba(61,220,120,0.04);
    border: 1px solid rgba(61,220,120,0.22);
    border-radius: 4px;
    color: var(--green-soft);
    font-family: inherit;
    font-size: 9.5px;
    line-height: 1.4;
    padding: 6px 8px;
    outline: none;
  }
  .overlay textarea:focus{ border-color: var(--green); }
  .overlay textarea::placeholder{ color: rgba(95,122,108,0.7); }
  .overlay .mini-btn{
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green-soft);
    font-family: inherit;
    font-size: 9.5px;
    padding: 5px 10px;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 4px;
  }
  .overlay .mini-btn:hover{ border-color: var(--green); }
  .overlay .mini-btn:focus-visible{ outline: 2px solid var(--amber); outline-offset:2px; }
  .overlay .status-line{
    font-size: 9.5px; color: var(--amber);
    min-height: 12px; text-shadow:none;
  }

  /* ---------------- RIGHT: console / auth panel ---------------- */
  .console-panel{
    padding: 34px 34px 28px;
    display:flex; flex-direction:column;
  }

  .console-head .pixel-title{
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    line-height: 1.6;
    color: var(--green);
    text-shadow: 0 0 10px rgba(61,220,120,0.5);
    margin: 0 0 10px;
  }
  .console-head p{
    font-size: 11.5px;
    color: var(--muted);
    margin: 0 0 22px;
  }

  .tabs{
    position: relative;
    display:flex;
    gap: 22px;
    margin-bottom: 26px;
    border-bottom: 1px solid rgba(61,220,120,0.15);
  }
  .tab-btn{
    background:none; border:none; cursor:pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--muted);
    padding: 0 0 12px;
    position: relative;
  }
  .tab-btn::before{ content:"> "; color: var(--green-dim); }
  .tab-btn.active{ color: var(--green); text-shadow: 0 0 6px var(--green); }
  .tab-btn.active::before{ color: var(--green); }
  .tab-btn:focus-visible{ outline: 2px solid var(--amber); outline-offset: 3px; }
  .tab-indicator{
    position:absolute; bottom:-1px; left:0;
    height: 2px; width: 78px;
    background: linear-gradient(90deg, var(--green), var(--green-soft));
    box-shadow: 0 0 8px rgba(61,220,120,0.6);
    transition: transform 0.3s ease, width 0.3s ease;
  }

  .auth-form{ display:none; }
  .auth-form.active{ display:block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform: translateY(0);} }

  .field{ position: relative; margin-bottom: 20px; }
  .field label{
    display:block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 7px;
  }
  .field .input-row{ position: relative; display:flex; align-items:center; }
  .field .input-row .prompt{ color: var(--green-dim); margin-right: 4px; font-size: 13px; }
  .field input{
    flex: 1;
    width: 100%;
    background: rgba(61,220,120,0.03);
    border: 1px solid rgba(61,220,120,0.18);
    border-radius: 4px;
    color: var(--green-soft);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 34px 9px 10px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field input::placeholder{ color: rgba(95,122,108,0.7); }
  .field input:focus{ border-color: var(--green); box-shadow: 0 0 0 3px rgba(61,220,120,0.08); }
  .field input.error{ border-color: var(--danger); }

  .toggle-eye{
    position:absolute; right: 8px;
    background:none; border:none; color: var(--muted);
    font-size: 9.5px; letter-spacing: 0.5px; cursor:pointer; padding: 4px;
  }
  .toggle-eye:hover{ color: var(--amber); }
  .toggle-eye:focus-visible{ outline: 2px solid var(--amber); outline-offset:2px; }

  .field-error{
    font-size: 10.5px;
    color: var(--danger);
    margin-top: 6px;
    min-height: 13px;
  }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin: -4px 0 22px; font-size: 11.5px;
  }
  .switch{ display:inline-flex; align-items:center; gap:8px; color: var(--muted); cursor:pointer; user-select:none; }
  .switch input{ position:absolute; opacity:0; width:0; height:0; }
  .switch .track{
    width: 28px; height: 15px; background: rgba(255,255,255,0.08); border-radius: 20px;
    position: relative; transition: background 0.2s ease; flex-shrink:0;
  }
  .switch .track::after{
    content:""; position:absolute; top:2px; left:2px; width:11px; height:11px;
    border-radius:50%; background: var(--muted); transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .track{ background: rgba(61,220,120,0.25); }
  .switch input:checked + .track::after{ transform: translateX(13px); background: var(--green); }
  .switch input:focus-visible + .track{ outline: 2px solid var(--amber); outline-offset:2px; }
  .row-between a{ color: var(--muted); text-decoration:none; }
  .row-between a:hover{ color: var(--amber); }

  .terms-row{
    display:flex; align-items:flex-start; gap: 9px;
    font-size: 11px; color: var(--muted); margin: -4px 0 22px; line-height:1.5;
  }
  .terms-row a{ color: var(--amber); text-decoration:none; }
  .terms-row a:hover{ text-decoration:underline; }
  .terms-row input{ margin-top: 2px; accent-color: var(--green); }

  .submit-btn{
    width: 100%;
    padding: 13px 18px;
    border: 1px solid var(--green);
    border-radius: 6px;
    background: rgba(61,220,120,0.08);
    color: var(--green);
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-shadow: 0 0 6px rgba(61,220,120,0.5);
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }
  .submit-btn:hover{ background: rgba(61,220,120,0.16); box-shadow: 0 0 20px rgba(61,220,120,0.15); }
  .submit-btn:active{ transform: translateY(1px); }
  .submit-btn:focus-visible{ outline: 2px solid var(--amber); outline-offset:3px; }
  .submit-btn:disabled{ opacity: 0.6; cursor: default; }

  .footnote{ text-align:center; font-size: 10.5px; color: var(--muted); margin-top: 20px; }
  .footnote a{ color: var(--amber); text-decoration:none; }
  .footnote a:hover{ text-decoration:underline; }

  @media (max-width: 700px){
    .crt-card{ grid-template-columns: 1fr; }
    .monitor-panel{ border-right:none; border-bottom:1px solid var(--green-dim); }
    canvas#board{ width: 220px; height: 220px; }
    .monitor-blurb{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .auth-form.active{ animation:none; }
    .submit-btn, .field input, .switch .track, .switch .track::after, .tab-indicator{ transition:none; }
  }
</style>
</head>
<body>

<div class="crt-card">

  <div class="monitor-panel">
    <div class="monitor-top">
      <span class="tag">&gt; SNAKE.SYS</span>
      <span class="stat">LEN:<span id="len">1</span> HI:<span id="hi">0</span></span>
    </div>

    <div id="mpScoreboard" class="hidden"></div>

    <div class="stage">
      <canvas id="board" width="260" height="260" tabindex="0"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>

    <div class="monitor-bottom">
      <span>NODE_04</span>
      <b>UPTIME 00:00</b>
    </div>

    <div class="monitor-blurb">
      終端機在登入前保持<b>鎖定</b> —— 驗證成功後，這條蛇就交給你操作。
    </div>
  </div>

  <div class="console-panel">
    <div class="console-head">
      <div class="pixel-title">TERM://ACCESS</div>
      <p>驗證身分以連線至主控制台</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">login</button>
      <button class="tab-btn" id="tabRegister" type="button">register</button>
      <div class="tab-indicator" id="tabIndicator"></div>
    </div>

    <!-- LOGIN -->
    <form class="auth-form active" id="loginForm" novalidate>
      <div class="field">
        <label for="loginUser">使用者 ID</label>
        <div class="input-row">
          <input type="text" id="loginUser" placeholder="user@node.sys" autocomplete="username" required>
        </div>
      </div>
      <div class="field">
        <label for="loginPass">通行密語</label>
        <div class="input-row">
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-eye" data-target="loginPass">顯示</button>
        </div>
      </div>
      <div class="row-between">
        <label class="switch">
          <input type="checkbox" id="loginRemember">
          <span class="track"></span>
          保持連線
        </label>
        <a href="#">忘記密語？</a>
      </div>
      <button type="submit" class="submit-btn">$ authenticate</button>
      <div class="footnote">還沒有帳號？<a href="#" id="gotoRegister">建立一個</a></div>
    </form>

    <!-- REGISTER -->
    <form class="auth-form" id="registerForm" novalidate>
      <div class="field">
        <label for="regHandle">顯示名稱</label>
        <div class="input-row">
          <input type="text" id="regHandle" placeholder="操作員代號" autocomplete="nickname" required>
        </div>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <div class="input-row">
          <input type="email" id="regEmail" placeholder="you@node.sys" autocomplete="email" required>
        </div>
      </div>
      <div class="field">
        <label for="regPass">通行密語</label>
        <div class="input-row">
          <input type="password" id="regPass" placeholder="至少 8 個字元" autocomplete="new-password" required minlength="8">
          <button type="button" class="toggle-eye" data-target="regPass">顯示</button>
        </div>
      </div>
      <div class="field">
        <label for="regConfirm">確認通行密語</label>
        <div class="input-row">
          <input type="password" id="regConfirm" placeholder="再輸入一次" autocomplete="new-password" required>
          <button type="button" class="toggle-eye" data-target="regConfirm">顯示</button>
        </div>
        <div class="field-error" id="regError"></div>
      </div>
      <div class="terms-row">
        <input type="checkbox" id="regTerms" required>
        <label for="regTerms">我同意 <a href="#">使用條款</a> 與 <a href="#">隱私權政策</a></label>
      </div>
      <button type="submit" class="submit-btn">$ create_account</button>
      <div class="footnote">已經有帳號？<a href="#" id="gotoLogin">回到登入</a></div>
    </form>
  </div>

</div>

<script>
/* ============ TAB SWITCHING ============ */
(function(){
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const indicator = document.getElementById('tabIndicator');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const gotoRegister = document.getElementById('gotoRegister');
  const gotoLogin = document.getElementById('gotoLogin');

  function showLogin(){
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
    indicator.style.transform = 'translateX(0px)';
    indicator.style.width = tabLogin.getBoundingClientRect().width + 'px';
    loginForm.classList.add('active');
    registerForm.classList.remove('active');
  }
  function showRegister(){
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
    const dx = tabRegister.getBoundingClientRect().left - tabLogin.getBoundingClientRect().left;
    indicator.style.transform = 'translateX(' + dx + 'px)';
    indicator.style.width = tabRegister.getBoundingClientRect().width + 'px';
    registerForm.classList.add('active');
    loginForm.classList.remove('active');
  }

  tabLogin.addEventListener('click', showLogin);
  tabRegister.addEventListener('click', showRegister);
  gotoRegister.addEventListener('click', (e) => { e.preventDefault(); showRegister(); });
  gotoLogin.addEventListener('click', (e) => { e.preventDefault(); showLogin(); });

  // init indicator width to match first tab
  window.addEventListener('load', () => {
    indicator.style.width = tabLogin.getBoundingClientRect().width + 'px';
  });

  /* ============ PASSWORD VISIBILITY ============ */
  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? '隱藏' : '顯示';
    });
  });

  /* ============ LOGIN SUBMIT ============ */
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = loginForm.querySelector('.submit-btn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '$ verifying...';
    setTimeout(() => {
      btn.textContent = '$ access_granted ✓';
      document.dispatchEvent(new CustomEvent('auth:success', { detail: { mode: 'login' } }));
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1200);
    }, 850);
  });

  /* ============ REGISTER SUBMIT ============ */
  const regPass = document.getElementById('regPass');
  const regConfirm = document.getElementById('regConfirm');
  const regError = document.getElementById('regError');

  registerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    regError.textContent = '';
    regPass.classList.remove('error');
    regConfirm.classList.remove('error');

    if(regPass.value.length < 8){
      regError.textContent = '通行密語至少需要 8 個字元';
      regPass.classList.add('error');
      return;
    }
    if(regPass.value !== regConfirm.value){
      regError.textContent = '兩次輸入的通行密語不一致';
      regConfirm.classList.add('error');
      return;
    }
    if(!document.getElementById('regTerms').checked){
      regError.textContent = '請先同意使用條款與隱私權政策';
      return;
    }

    const btn = registerForm.querySelector('.submit-btn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '$ creating...';
    setTimeout(() => {
      btn.textContent = '$ account_created ✓';
      document.dispatchEvent(new CustomEvent('auth:success', { detail: { mode: 'register' } }));
      setTimeout(() => {
        btn.textContent = original;
        btn.disabled = false;
        showLogin();
      }, 1200);
    }, 900);
  });
})();

/* ============ SNAKE GAME (organic renderer) ============ */
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELL = canvas.width / GRID;
  const overlay = document.getElementById('overlay');
  const lenEl = document.getElementById('len');
  const hiEl = document.getElementById('hi');
  const mpScoreboard = document.getElementById('mpScoreboard');

  let snake, dir, nextDir, food, score, hi, running, paused, speedMs, loopHandle;
  let prevSnake, lastStepTime, unlocked = false;
  let gameMode = 'solo'; // 'solo' | 'multi'

  // ---- multiplayer state ----
  const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  const MP_SPEED = 130;
  let pc = null, dc = null, role = null, mpConnected = false;
  let mpHost, mpGuest, mpFood, mpRunning = false, mpLoopHandle = null;
  let mpPrevHost = [], mpPrevGuest = [];
  let mpView = null; // guest's display snapshot: {prevHost,curHost,prevGuest,curGuest,food,tickStart,tickSpeed}
  let mpHostScoreDisp = 0, mpGuestScoreDisp = 0;
  let mpLastTick = 0;

  hi = Number(localStorage.getItem('termsnake_hi') || 0);
  hiEl.textContent = hi;

  function clonePts(arr){ return arr.map(s => ({x:s.x, y:s.y})); }

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    prevSnake = clonePts(snake);
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speedMs = 140;
    paused = false;
    lastStepTime = performance.now();
    placeFood();
    lenEl.textContent = snake.length;
  }

  function placeFood(){
    let ok=false, fx, fy;
    while(!ok){
      fx = Math.floor(Math.random()*GRID);
      fy = Math.floor(Math.random()*GRID);
      ok = !snake.some(s => s.x===fx && s.y===fy);
    }
    food = {x:fx, y:fy};
  }

  function drawGrid(){
    ctx.strokeStyle = 'rgba(61,220,120,0.06)';
    ctx.lineWidth = 1;
    for(let i=0;i<=GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
    }
  }

  const SCHEME_YOU = {
    bodyLow: [46,214,98], glow: 'rgba(61,220,120,0.35)', spine: 'rgba(180,255,200,0.18)',
    headGrad: ['#8dffab','#3ddc78','#12611f'], headGlow: '#3ddc78', tongue: '#ff5c5c', eyeWhite: '#ffe9a8'
  };
  const SCHEME_THEM = {
    bodyLow: [214,150,46], glow: 'rgba(255,178,56,0.35)', spine: 'rgba(255,224,170,0.18)',
    headGrad: ['#ffe4a0','#ffb238','#7a4d10'], headGlow: '#ffb238', tongue: '#ff5c5c', eyeWhite: '#fff2c8'
  };

  function drawFoodAt(pos, now){
    const pulse = (Math.sin(now/220) + 1) / 2;
    const cx = pos.x*CELL + CELL/2, cy = pos.y*CELL + CELL/2;
    const r = CELL*0.28 + pulse*CELL*0.08;
    ctx.save();
    ctx.shadowColor = '#ffb238';
    ctx.shadowBlur = 10 + pulse*8;
    const g = ctx.createRadialGradient(cx-2,cy-2,1, cx,cy,r);
    g.addColorStop(0, '#fff2c8'); g.addColorStop(0.5, '#ffb238'); g.addColorStop(1, '#6b4c14');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function interpGeneric(prevArr, curArr, t){
    const n = curArr.length;
    const pts = new Array(n);
    for(let i=0;i<n;i++){
      const a = (prevArr && prevArr[i]) || curArr[i];
      const b = curArr[i];
      let dx = b.x - a.x, dy = b.y - a.y;
      if(Math.abs(dx) > 1) dx = 0;
      if(Math.abs(dy) > 1) dy = 0;
      pts[i] = { x: (a.x + dx*t)*CELL + CELL/2, y: (a.y + dy*t)*CELL + CELL/2 };
    }
    return pts;
  }

  function getInterpPoints(t){
    return interpGeneric(prevSnake, snake, t);
  }

  function drawSnakeOrganic(pts, now, scheme, alive){
    scheme = scheme || SCHEME_YOU;
    const n = pts.length;
    if(n === 0) return;
    ctx.save();
    if(alive === false) ctx.globalAlpha = 0.35;
    const headW = CELL*0.85, tailW = CELL*0.28;

    for(let i=n-1;i>=1;i--){
      const p0 = pts[i], p1 = pts[i-1];
      const t0 = 1 - (i/(n-1)), t1 = 1 - ((i-1)/(n-1));
      const w = ((tailW+(headW-tailW)*t0) + (tailW+(headW-tailW)*t1)) / 2;
      const [cr,cg,cb] = scheme.bodyLow;
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.4 + 0.55*t0})`;
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=w;
      ctx.shadowColor=scheme.glow; ctx.shadowBlur=4;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

      if(i % 2 === 0){
        const mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
        const ang = Math.atan2(p1.y-p0.y, p1.x-p0.x);
        ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
        ctx.strokeStyle='rgba(6,20,8,0.35)'; ctx.lineWidth=Math.max(1,w*0.08); ctx.shadowBlur=0;
        ctx.beginPath(); ctx.moveTo(-w*0.28,-w*0.22); ctx.lineTo(0,0); ctx.lineTo(-w*0.28,w*0.22); ctx.stroke();
        ctx.restore();
      }
    }
    ctx.shadowBlur = 0;

    ctx.strokeStyle=scheme.spine; ctx.lineWidth=Math.max(1,headW*0.12); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<n;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();

    drawHead(pts, headW, now, scheme);
    ctx.restore();
  }

  function drawHead(pts, headW, now, scheme){
    scheme = scheme || SCHEME_YOU;
    const head = pts[0], neck = pts[1] || {x:head.x-1,y:head.y};
    let ang = Math.atan2(head.y-neck.y, head.x-neck.x);
    if(isNaN(ang)) ang = 0;

    ctx.save(); ctx.translate(head.x, head.y); ctx.rotate(ang);
    const g = ctx.createRadialGradient(-headW*0.15,-headW*0.15,1, 0,0, headW*0.6);
    g.addColorStop(0,scheme.headGrad[0]); g.addColorStop(0.55,scheme.headGrad[1]); g.addColorStop(1,scheme.headGrad[2]);
    ctx.fillStyle = g; ctx.shadowColor=scheme.headGlow; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.ellipse(headW*0.08,0,headW*0.55,headW*0.42,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    if((now % 1400) < 260){
      const tl = headW*0.7;
      ctx.strokeStyle = scheme.tongue; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(headW*0.55,0); ctx.lineTo(headW*0.55+tl,0);
      ctx.moveTo(headW*0.55+tl,0); ctx.lineTo(headW*0.55+tl+4,-4);
      ctx.moveTo(headW*0.55+tl,0); ctx.lineTo(headW*0.55+tl+4,4);
      ctx.stroke();
    }

    const ex = headW*0.06, ey = headW*0.22;
    [-1,1].forEach(side => {
      ctx.fillStyle = '#0a1a0c';
      ctx.beginPath(); ctx.ellipse(ex, side*ey, headW*0.11, headW*0.13, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = scheme.eyeWhite;
      ctx.beginPath(); ctx.arc(ex+headW*0.03, side*ey-headW*0.02, headW*0.045, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function renderFrame(now){
    if(gameMode === 'multi'){
      renderMultiFrame(now);
      requestAnimationFrame(renderFrame);
      return;
    }
    const t = Math.min(1, (now-lastStepTime)/speedMs);
    const pts = getInterpPoints(t);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid(); drawFoodAt(food, now); drawSnakeOrganic(pts, now, SCHEME_YOU, true);
    requestAnimationFrame(renderFrame);
  }

  function renderMultiFrame(now){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    if(role === 'host'){
      if(!mpHost) return;
      const t = Math.min(1, (now-mpLastTick)/MP_SPEED);
      const hostPts = interpGeneric(mpPrevHost, mpHost.segs, t);
      const guestPts = interpGeneric(mpPrevGuest, mpGuest.segs, t);
      drawFoodAt(mpFood, now);
      drawSnakeOrganic(guestPts, now, SCHEME_THEM, mpGuest.alive);
      drawSnakeOrganic(hostPts, now, SCHEME_YOU, mpHost.alive);
    } else if(role === 'guest' && mpView){
      const t = Math.min(1, (now-mpView.tickStart)/mpView.tickSpeed);
      const hostPts = interpGeneric(mpView.prevHost, mpView.curHost, t);
      const guestPts = interpGeneric(mpView.prevGuest, mpView.curGuest, t);
      drawFoodAt(mpView.food, now);
      drawSnakeOrganic(hostPts, now, SCHEME_THEM, mpView.hostAlive);
      drawSnakeOrganic(guestPts, now, SCHEME_YOU, mpView.guestAlive);
    }
  }

  function step(){
    if(paused) return;
    dir = nextDir;
    const oldSnake = clonePts(snake);
    const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};

    if(head.x<0 || head.x>=GRID || head.y<0 || head.y>=GRID) return gameOver();
    if(snake.some(s => s.x===head.x && s.y===head.y)) return gameOver();

    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score++; lenEl.textContent = snake.length;
      speedMs = Math.max(70, speedMs-3);
      placeFood();
    } else {
      snake.pop();
    }
    prevSnake = [oldSnake[0]].concat(oldSnake.slice(0, snake.length-1));
    lastStepTime = performance.now();
  }

  function gameOver(){
    running = false;
    clearInterval(loopHandle);
    if(score > hi){ hi = score; localStorage.setItem('termsnake_hi', hi); hiEl.textContent = hi; }
    showOverlay('程序已終止_', ['最終長度: ' + snake.length, '按下方按鈕重新啟動'], '重新執行');
  }

  /* ============ CONNECT UI (manual WebRTC signaling) ============ */
  function renderConnectOverlay(){
    overlay.innerHTML = '';
    const h3=document.createElement('h3'); h3.textContent='連線設置_'; overlay.appendChild(h3);

    const tabs=document.createElement('div'); tabs.className='mp-tabs';
    const hostTab=document.createElement('button'); hostTab.type='button'; hostTab.className='mp-tab active'; hostTab.textContent='建立房間';
    const joinTab=document.createElement('button'); joinTab.type='button'; joinTab.className='mp-tab'; joinTab.textContent='加入房間';
    tabs.appendChild(hostTab); tabs.appendChild(joinTab);
    overlay.appendChild(tabs);

    const body=document.createElement('div'); body.style.width='100%';
    overlay.appendChild(body);

    const backBtn=document.createElement('button'); backBtn.className='mini-btn'; backBtn.textContent='← 返回選單'; backBtn.style.marginTop='8px';
    backBtn.addEventListener('click', () => { cleanupPendingConnection(); renderMenuOverlay(); });

    function renderHostPane(){
      hostTab.classList.add('active'); joinTab.classList.remove('active');
      body.innerHTML = '';
      const genBtn=document.createElement('button'); genBtn.className='term-btn'; genBtn.textContent='產生連線代碼';
      const codeArea=document.createElement('textarea'); codeArea.readOnly=true; codeArea.placeholder='代碼將顯示在這裡…';
      codeArea.addEventListener('click', () => codeArea.select());
      const copyBtn=document.createElement('button'); copyBtn.className='mini-btn'; copyBtn.textContent='複製代碼'; copyBtn.style.display='none';
      const answerLabel=document.createElement('div'); answerLabel.className='hint'; answerLabel.textContent='把代碼傳給朋友，再貼上他回傳的代碼：'; answerLabel.style.display='none';
      const answerArea=document.createElement('textarea'); answerArea.placeholder='貼上朋友的回覆代碼'; answerArea.style.display='none';
      const connectBtn=document.createElement('button'); connectBtn.className='term-btn'; connectBtn.textContent='完成配對'; connectBtn.style.display='none';
      const status=document.createElement('div'); status.className='status-line';

      genBtn.addEventListener('click', async () => {
        genBtn.disabled = true; status.textContent = '產生代碼中…';
        role = 'host';
        try{
          const code = await createHostOffer();
          codeArea.value = code;
          copyBtn.style.display='inline-block';
          answerLabel.style.display='block';
          answerArea.style.display='block';
          connectBtn.style.display='inline-block';
          status.textContent = '請把上面的代碼傳給朋友';
        }catch(err){
          status.textContent = '產生代碼失敗，請重試';
          genBtn.disabled = false;
        }
      });
      copyBtn.addEventListener('click', () => copyText(codeArea.value, copyBtn));
      connectBtn.addEventListener('click', async () => {
        if(!answerArea.value.trim()){ status.textContent='請先貼上朋友的代碼'; return; }
        connectBtn.disabled = true; status.textContent='配對中…';
        try{
          await completeHostWithAnswer(answerArea.value);
          status.textContent = '配對成功，等待連線建立…';
        }catch(err){
          status.textContent = '代碼無效，請確認後再試一次';
          connectBtn.disabled = false;
        }
      });

      body.appendChild(genBtn);
      body.appendChild(codeArea);
      body.appendChild(copyBtn);
      body.appendChild(answerLabel);
      body.appendChild(answerArea);
      body.appendChild(connectBtn);
      body.appendChild(status);
    }

    function renderJoinPane(){
      joinTab.classList.add('active'); hostTab.classList.remove('active');
      body.innerHTML = '';
      const offerLabel=document.createElement('div'); offerLabel.className='hint'; offerLabel.textContent='貼上房主給你的代碼：';
      const offerArea=document.createElement('textarea'); offerArea.placeholder='貼上房主的代碼';
      const genBtn=document.createElement('button'); genBtn.className='term-btn'; genBtn.textContent='產生我的代碼';
      const codeArea=document.createElement('textarea'); codeArea.readOnly=true; codeArea.style.display='none'; codeArea.placeholder='你的代碼將顯示在這裡…';
      codeArea.addEventListener('click', () => codeArea.select());
      const copyBtn=document.createElement('button'); copyBtn.className='mini-btn'; copyBtn.textContent='複製代碼'; copyBtn.style.display='none';
      const status=document.createElement('div'); status.className='status-line';

      genBtn.addEventListener('click', async () => {
        if(!offerArea.value.trim()){ status.textContent='請先貼上房主的代碼'; return; }
        genBtn.disabled = true; status.textContent='產生代碼中…';
        role = 'guest';
        try{
          const code = await joinWithOfferCode(offerArea.value);
          codeArea.value = code; codeArea.style.display='block'; copyBtn.style.display='inline-block';
          status.textContent = '把這組代碼傳回房主，等待對方完成配對…';
        }catch(err){
          status.textContent = '房主代碼無效，請確認後再試一次';
          genBtn.disabled = false;
        }
      });
      copyBtn.addEventListener('click', () => copyText(codeArea.value, copyBtn));

      body.appendChild(offerLabel);
      body.appendChild(offerArea);
      body.appendChild(genBtn);
      body.appendChild(codeArea);
      body.appendChild(copyBtn);
      body.appendChild(status);
    }

    hostTab.addEventListener('click', renderHostPane);
    joinTab.addEventListener('click', renderJoinPane);

    overlay.appendChild(backBtn);
    renderHostPane();
    overlay.classList.remove('hidden');

  function copyText(text, btn){
    const original = btn.textContent;
    function done(ok){ btn.textContent = ok ? '已複製 ✓' : '請手動複製'; setTimeout(()=>{btn.textContent=original;},1500); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(false));
    } else { done(false); }
  }

  function cleanupPendingConnection(){
    if(pc && !mpConnected){ try{ pc.close(); }catch(e){} pc=null; role=null; }
  }

  /* ============ WEBRTC SIGNALING ============ */
  function waitIceComplete(peer){
    return new Promise(resolve => {
      if(peer.iceGatheringState === 'complete'){ resolve(); return; }
      function check(){
        if(peer.iceGatheringState === 'complete'){
          peer.removeEventListener('icegatheringstatechange', check);
          resolve();
        }
      }
      peer.addEventListener('icegatheringstatechange', check);
    });
  }
  function encodeDesc(desc){ return btoa(encodeURIComponent(JSON.stringify(desc))); }
  function decodeDesc(code){ return JSON.parse(decodeURIComponent(atob(code.trim()))); }

  function setupDataChannel(channel){
    dc = channel;
    dc.onopen = () => onPeerConnected();
    dc.onclose = () => onPeerDisconnected();
    dc.onmessage = (e) => { try{ handlePeerMessage(JSON.parse(e.data)); }catch(err){} };
  }

  async function createHostOffer(){
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    setupDataChannel(pc.createDataChannel('game'));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIceComplete(pc);
    return encodeDesc(pc.localDescription);
  }

  async function joinWithOfferCode(code){
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.ondatachannel = (e) => setupDataChannel(e.channel);
    const offer = decodeDesc(code);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitIceComplete(pc);
    return encodeDesc(pc.localDescription);
  }

  async function completeHostWithAnswer(code){
    const answer = decodeDesc(code);
    await pc.setRemoteDescription(answer);
  }

  function onPeerConnected(){
    mpConnected = true;
    gameMode = 'multi';
    overlay.classList.add('hidden');
    mpScoreboard.classList.remove('hidden');
    if(role === 'host'){
      initMultiplayerState();
      mpHostScoreDisp = 0; mpGuestScoreDisp = 0;
      mpRunning = true;
      clearInterval(mpLoopHandle);
      mpLoopHandle = setInterval(mpStep, MP_SPEED);
    }
    updateScoreboard();
    canvas.focus();
  }

  function onPeerDisconnected(){
    if(!mpConnected && gameMode !== 'multi') return;
    mpConnected = false;
    mpRunning = false;
    clearInterval(mpLoopHandle);
    gameMode = 'solo';
    mpScoreboard.classList.add('hidden');
    renderOverlayDisconnected();
  }

  function renderOverlayDisconnected(){
    overlay.innerHTML='';
    const h3=document.createElement('h3'); h3.textContent='連線已中斷_'; overlay.appendChild(h3);
    const p=document.createElement('p'); p.textContent='對方已離線或連線中斷'; overlay.appendChild(p);
    const btn=document.createElement('button'); btn.className='term-btn'; btn.textContent='返回選單';
    btn.addEventListener('click', renderMenuOverlay);
    overlay.appendChild(btn);
    overlay.classList.remove('hidden');
  }

  function leaveMultiplayer(silent){
    if(dc){ try{ dc.close(); }catch(e){} }
    if(pc){ try{ pc.close(); }catch(e){} }
    dc = null; pc = null; role = null;
    gameMode = 'solo';
    mpConnected = false; mpRunning = false;
    clearInterval(mpLoopHandle);
    mpScoreboard.classList.add('hidden');
    if(!silent){ renderMenuOverlay(); }
  }

  /* ============ MULTIPLAYER SIMULATION (host-authoritative) ============ */
  function initMultiplayerState(){
    mpHost = { segs:[{x:5,y:10},{x:4,y:10},{x:3,y:10}], dir:{x:1,y:0}, nextDir:{x:1,y:0}, alive:true, score:0 };
    mpGuest = { segs:[{x:14,y:10},{x:15,y:10},{x:16,y:10}], dir:{x:-1,y:0}, nextDir:{x:-1,y:0}, alive:true, score:0 };
    mpPrevHost = clonePts(mpHost.segs);
    mpPrevGuest = clonePts(mpGuest.segs);
    mpLastTick = performance.now();
    placeMpFood();
  }

  function placeMpFood(){
    let ok=false, fx, fy;
    while(!ok){
      fx = Math.floor(Math.random()*GRID); fy = Math.floor(Math.random()*GRID);
      ok = !mpHost.segs.some(s=>s.x===fx&&s.y===fy) && !mpGuest.segs.some(s=>s.x===fx&&s.y===fy);
    }
    mpFood = {x:fx, y:fy};
  }

  function alignPrev(oldArr, newLen){
    if(newLen === 0) return [];
    return [oldArr[0]].concat(oldArr.slice(0, newLen-1));
  }

  function mpStep(){
    if(!mpRunning) return;
    const oldHost = clonePts(mpHost.segs), oldGuest = clonePts(mpGuest.segs);
    if(mpHost.alive) mpHost.dir = mpHost.nextDir;
    if(mpGuest.alive) mpGuest.dir = mpGuest.nextDir;

    function computeNext(player, oldSelf, oldOther){
      if(!player.alive) return null;
      const head = {x: player.segs[0].x+player.dir.x, y: player.segs[0].y+player.dir.y};
      let dead = head.x<0||head.x>=GRID||head.y<0||head.y>=GRID;
      if(!dead && oldSelf.some(s=>s.x===head.x&&s.y===head.y)) dead = true;
      if(!dead && oldOther.some(s=>s.x===head.x&&s.y===head.y)) dead = true;
      return { head, dead };
    }

    const hostNext = computeNext(mpHost, oldHost, oldGuest);
    const guestNext = computeNext(mpGuest, oldGuest, oldHost);
    let ateFood = false;

    if(hostNext){
      if(hostNext.dead) mpHost.alive = false;
      else {
        mpHost.segs.unshift(hostNext.head);
        if(hostNext.head.x===mpFood.x && hostNext.head.y===mpFood.y){ mpHost.score++; ateFood=true; }
        else mpHost.segs.pop();
      }
    }
    if(guestNext){
      if(guestNext.dead) mpGuest.alive = false;
      else {
        mpGuest.segs.unshift(guestNext.head);
        if(guestNext.head.x===mpFood.x && guestNext.head.y===mpFood.y){ mpGuest.score++; ateFood=true; }
        else mpGuest.segs.pop();
      }
    }
    if(ateFood) placeMpFood();

    mpPrevHost = mpHost.alive ? alignPrev(oldHost, mpHost.segs.length) : clonePts(mpHost.segs);
    mpPrevGuest = mpGuest.alive ? alignPrev(oldGuest, mpGuest.segs.length) : clonePts(mpGuest.segs);
    mpLastTick = performance.now();

    mpHostScoreDisp = mpHost.score; mpGuestScoreDisp = mpGuest.score;
    updateScoreboard();
    mpBroadcastState();

    if(!mpHost.alive || !mpGuest.alive){
      endMultiplayerRound();
    }
  }

  function mpBroadcastState(){
    if(!dc || dc.readyState !== 'open') return;
    dc.send(JSON.stringify({
      type:'state',
      host: mpHost.segs, guest: mpGuest.segs, food: mpFood,
      hostAlive: mpHost.alive, guestAlive: mpGuest.alive,
      hostScore: mpHost.score, guestScore: mpGuest.score,
      speed: MP_SPEED
    }));
  }

  function endMultiplayerRound(){
    mpRunning = false;
    clearInterval(mpLoopHandle);
    let result;
    if(!mpHost.alive && !mpGuest.alive) result = 'draw';
    else if(mpHost.alive) result = 'host_wins';
    else result = 'guest_wins';
    if(dc && dc.readyState === 'open'){
      dc.send(JSON.stringify({ type:'gameover', result, hostScore: mpHost.score, guestScore: mpGuest.score }));
    }
    showMultiplayerGameOver(result);
  }

  function showMultiplayerGameOver(result){
    overlay.innerHTML = '';
    const iAmHost = role === 'host';
    const youWon = (result === 'host_wins' && iAmHost) || (result === 'guest_wins' && !iAmHost);
    let title, msg;
    if(result === 'draw'){ title = '平手_'; msg = '雙方同時陣亡'; }
    else if(youWon){ title = '你獲勝了_'; msg = '對方的訊號已終止'; }
    else { title = '你被擊敗_'; msg = '對方的蛇還活著'; }

    const h3 = document.createElement('h3'); h3.textContent = title; overlay.appendChild(h3);
    const p = document.createElement('p'); p.textContent = msg; overlay.appendChild(p);

    if(role === 'host'){
      const btn = document.createElement('button');
      btn.className='term-btn'; btn.textContent = '再玩一局';
      btn.addEventListener('click', () => {
        initMultiplayerState();
        mpHostScoreDisp = 0; mpGuestScoreDisp = 0;
        mpRunning = true;
        overlay.classList.add('hidden');
        clearInterval(mpLoopHandle);
        mpLoopHandle = setInterval(mpStep, MP_SPEED);
      });
      overlay.appendChild(btn);
    } else {
      const p2 = document.createElement('p'); p2.style.color='var(--muted)'; p2.textContent='等待房主開始新局…';
      overlay.appendChild(p2);
    }

    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'term-btn'; leaveBtn.textContent = '離開連線'; leaveBtn.style.marginTop='4px';
    leaveBtn.addEventListener('click', () => leaveMultiplayer());
    overlay.appendChild(leaveBtn);

    overlay.classList.remove('hidden');
  }

  function updateScoreboard(){
    const youAreHost = role === 'host';
    const youScore = youAreHost ? mpHostScoreDisp : mpGuestScoreDisp;
    const themScore = youAreHost ? mpGuestScoreDisp : mpHostScoreDisp;
    mpScoreboard.innerHTML = '<span class="you">🟢 你 '+youScore+'</span><span class="them">🟠 對方 '+themScore+'</span>';
  }

  function handlePeerMessage(msg){
    if(msg.type === 'state'){
      if(role !== 'guest') return;
      mpView = {
        prevHost: mpView ? mpView.curHost : msg.host,
        curHost: msg.host,
        prevGuest: mpView ? mpView.curGuest : msg.guest,
        curGuest: msg.guest,
        food: msg.food,
        tickStart: performance.now(),
        tickSpeed: msg.speed || MP_SPEED,
        hostAlive: msg.hostAlive,
        guestAlive: msg.guestAlive
      };
      mpHostScoreDisp = msg.hostScore; mpGuestScoreDisp = msg.guestScore;
      updateScoreboard();
    } else if(msg.type === 'input'){
      if(role !== 'host' || !mpGuest) return;
      const d = msg.dir;
      if(d && !(d.x === -mpGuest.dir.x && d.y === -mpGuest.dir.y)) mpGuest.nextDir = d;
    } else if(msg.type === 'gameover'){
      if(role === 'guest'){
        mpHostScoreDisp = msg.hostScore; mpGuestScoreDisp = msg.guestScore;
        showMultiplayerGameOver(msg.result);
      }
    }
  }

  let lastSpeed;
  function loopTick(){
    step();
    if(speedMs !== lastSpeed){
      lastSpeed = speedMs;
      clearInterval(loopHandle);
      loopHandle = setInterval(loopTick, speedMs);
    }
  }

  function beginGame(){
    if(!unlocked) return;
    leaveMultiplayer(true);
    overlay.classList.add('hidden');
    reset();
    running = true; lastSpeed = speedMs;
    clearInterval(loopHandle);
    loopHandle = setInterval(loopTick, speedMs);
    canvas.focus();
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(k)) e.preventDefault();

    let d = null;
    if(k==='arrowup'||k==='w') d={x:0,y:-1};
    else if(k==='arrowdown'||k==='s') d={x:0,y:1};
    else if(k==='arrowleft'||k==='a') d={x:-1,y:0};
    else if(k==='arrowright'||k==='d') d={x:1,y:0};

    if(gameMode === 'multi'){
      if(!mpConnected || !d) return;
      if(role === 'host' && mpHost){
        if(d.x===-mpHost.dir.x && d.y===-mpHost.dir.y) return;
        mpHost.nextDir = d;
      } else if(role === 'guest' && dc && dc.readyState === 'open'){
        dc.send(JSON.stringify({ type:'input', dir:d }));
      }
      return;
    }

    if(!unlocked || !running) return;
    if(k === ' '){ paused = !paused; return; }
    if(d){ if(d.x===-dir.x && d.y===-dir.y) return; nextDir = d; }
  });

  renderLockedOverlay();
  reset();
  requestAnimationFrame(renderFrame);
})();
</script>

</body>
</html>
